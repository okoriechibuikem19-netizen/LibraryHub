spring.application.name=libraryhub-api
server.port=${PORT:8080}

# Load local secrets from .env (never commit it). Works whether you run from the project root or backend folder.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# MongoDB Atlas
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=libraryhub
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=libraryhub
spring.data.mongodb.auto-index-creation=true

# Security & CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.session-hours=${SESSION_HOURS:8}
app.auth.cookie-secure=${COOKIE_SECURE:false}

# OTP
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.show-in-response=${SHOW_DEV_OTP:false}

# Mail Configuration
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Bootstrap
app.bootstrap.admin-name=${ADMIN_NAME:LibraryHub Administrator}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info